// Pinned trio (wrapper below): Gradle 8.7 + AGP 8.4 + Kotlin 1.9. AGP 8
// needs JDK 17, which `make android-apk` selects via java_home.
// No androidx/compose deps anywhere - the app is plain framework widgets.
plugins {
    id 'com.android.application' version '8.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
