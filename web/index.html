<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM CRUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>LLM entries</h1>
  <div class="filters">
    <input id="q" type="search" placeholder="search name / model_id…">
    <select id="enabled">
      <option value="">all</option>
      <option value="true">enabled</option>
      <option value="false">disabled</option>
    </select>
    <button id="refresh">refresh</button>
  </div>
</header>

<main>
  <section id="list">
    <table>
      <thead><tr>
        <th>name</th><th>provider</th><th>model_id</th>
        <th class="num">context</th><th>enabled</th><th>tags</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>no entries — create one below</p>
  </section>

  <section id="form-sec">
    <h2 id="form-title">create entry</h2>
    <form id="form">
      <input type="hidden" id="f-id">
      <label>name *<input id="f-name" required></label>
      <label>provider *<input id="f-provider" required placeholder="openai / anthropic / ollama…"></label>
      <label>model_id *<input id="f-model-id" required></label>
      <label>endpoint<input id="f-endpoint" placeholder="http://localhost:11434"></label>
      <label>context_length<input id="f-context" type="number" min="0" value="0"></label>
      <label class="check">enabled<input id="f-enabled" type="checkbox" checked></label>
      <label>tags (comma separated)<input id="f-tags"></label>
      <div class="actions">
        <button type="submit" id="save">save</button>
        <button type="button" id="cancel" hidden>cancel edit</button>
      </div>
      <p id="form-error" class="error" hidden></p>
    </form>
  </section>
</main>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
